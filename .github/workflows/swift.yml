# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      change: ${{ steps.scope.outputs.change }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changes and check whitespace
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 Scripts/test-ci-change-scope.py
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --check "$BASE" "$HEAD"
            change=$(python3 Scripts/ci-change-scope.py "$BASE" "$HEAD")
          else
            change=code
          fi
          echo "change=$change" >> "$GITHUB_OUTPUT"

  build:
    needs: scope
    if: ${{ always() }}
    runs-on: ${{ needs.scope.outputs.change == 'documentation' && 'ubuntu-latest' || 'macos-26' }}
    steps:
      - name: Require successful scope check
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - name: Documentation checks passed
        if: ${{ needs.scope.outputs.change == 'documentation' }}
        run: echo 'Documentation-only change; no application build or code tests required.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.scope.outputs.change != 'documentation' }}
      - name: Select Xcode 26
        if: ${{ needs.scope.outputs.change != 'documentation' }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'
      - name: Build
        if: ${{ needs.scope.outputs.change != 'documentation' }}
        run: xcodebuild -project RefineID.xcodeproj -scheme RefineID CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build
      - name: Run CardCore package tests
        if: ${{ needs.scope.outputs.change != 'documentation' }}
        run: swift test --package-path CardCore -v
      - name: Run application unit tests
        if: ${{ needs.scope.outputs.change != 'documentation' }}
        run: xcodebuild -project RefineID.xcodeproj -scheme RefineID -destination 'platform=macOS' -only-testing:RefineIDTests CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO test
