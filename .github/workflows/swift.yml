name: Swift verification

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test local quality receipt gate
        run: python3 -B Scripts/TestQualityReceipt.py
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'
      - name: Build
        run: xcodebuild -project RefineID.xcodeproj -scheme RefineID CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build
      - name: Run CardCore package tests
        run: swift test --package-path CardCore -v
      - name: Run application unit tests
        run: xcodebuild -project RefineID.xcodeproj -scheme RefineID -destination 'platform=macOS' -only-testing:RefineIDTests CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO test
