# SwiftLint owns defects. Gate: `swiftlint lint` with strict: true.
# Baseline: .swiftlint-baseline.json. New findings fail.
#
# Not `--enable-all-rules`: it ignores disabled_rules and this carve
# register. Opt-in rules are enumerated instead.
#
# Carve register -- opt-in rules omitted:
#
# Owned by swift-format:
#
# contrasted_opening_brace
#
# swift-format emits K&R same-line braces.
#
# vertical_whitespace_between_cases
#
# swift-format owns case spacing.
#
# conditional_returns_on_newline
#
# swift-format keeps `guard ... else { return }`.
#
# multiline_arguments_brackets
#
# swift-format owns call-bracket placement.
#
# multiline_arguments
#
# swift-format owns how call arguments wrap.
#
# multiline_call_arguments
#
# swift-format owns how call arguments pack across lines.
#
# indentation_width
#
# swift-format owns indentation, including continuation depth.
#
# vertical_whitespace_opening_braces
#
# swift-format owns whitespace after `{`.
#
# vertical_whitespace_closing_braces
#
# swift-format owns whitespace before `}`.
#
# let_var_whitespace
#
# swift-format owns blank lines around declarations.
#
# pattern_matching_keywords
#
# swift-format emits `case .a(let x)`; this rule rewrites `case let .a(x)`.
#
# strict_fileprivate
#
# swift-format moves extension ACLs onto members as `fileprivate`.
#
# extension_access_modifier
#
# opposite rewrite; kept no_extension_access_modifier.
#
# trailing_closure
#
# swift-format labels every closure; this rule's fixer strips the label.
#
# Default rules with the same fight live in disabled_rules:
# opening_brace, closure_parameter_position, trailing_comma.
#
# Framework / idiom mismatch:
#
# prefer_nimble
#
# tests use Swift Testing, not Nimble.
#
# nimble_operator
#
# Nimble-only operator rule.
#
# prefixed_toplevel_constant
#
# k-prefix Apple abandoned in Swift 3; contradicts AlwaysUseLowerCamelCase.
#
# Mutually exclusive with a kept rule:
#
# explicit_type_interface
#
# contradicts redundant_type_annotation.
#
# redundant_string_enum_value
#
# contradicts explicit_enum_raw_value. Keep explicit wire values.
#
# Counterproductive:
#
# required_deinit
#
# empty deinit on every class conflicts with no_empty_block.
#
# Analyzer rules (capture_variable, explicit_self, typesafe_array_init,
# unused_declaration, unused_import) need `swiftlint analyze` with a
# compile database. Future gate work, not enabled here.

strict: true

# Empty on purpose: SwiftLint's default i / id / x / y / z list is not used.
identifier_name:
  excluded: []

# Default file_header forbids "Copyright" (Xcode auto-headers). Point it
# at the header this tree uses.
file_header:
  required_pattern: '// Copyright \d{4} Petri Koistinen'

# Typing discipline (Documentation/typing-discipline.md).
custom_rules:
  raw_byte_array_in_api:
    name: "Raw [UInt8] across an API boundary"
    regex: '(?:func|init)\b[^{}\n]*\[UInt8\]'
    excluded:
      # Sanctioned bytes<->domain boundaries; tests.
      - ".*/ZeroizingDigitStore\\.swift"
      - ".*/ApplicationIdentifier\\.swift"
      - ".*/EcdsaSignature\\.swift"
      - ".*/Tests/.*"
    message: >
      A function takes or returns a raw [UInt8] across an API boundary.
      Wrap it in a domain type so strong typing is not discarded at the
      boundary -- the only sanctioned raw boundary is a domain type's own
      validating initializer. See Documentation/typing-discipline.md.
    severity: error

  unexplained_hex:
    name: "Unexplained hex literal"
    regex: '\b0x[0-9A-Fa-f_]+\b'
    excluded:
      # Named protocol values; DER tags; tests; fixtures.
      - ".*/CardCore/Sources/CardCore/Values/.*"
      - ".*/Samples/NFCCardTiming/Sources/Values/.*"
      - ".*/EcdsaSignature\\.swift"
      - ".*/Tests/.*"
      - ".*/TestVectors/.*"
    message: >
      Hex literals are allowed only inside named protocol-value definitions
      in dedicated files or provenance-marked test-vector files. Give the
      value a named, documented home. See Documentation/release-plan.md section 4.4.
    severity: error

  no_nuclear_lint_suppression:
    name: "Nuclear lint suppression"
    regex: 'swiftlint:disable(?::(?:next|this|previous))?\s+all\b'
    message: >
      Do not disable all SwiftLint rules. Fix the finding, or add a
      named suppression to Scripts/lint-suppression-register.json.
    severity: error

  no_format_ignore_file:
    name: "File-level swift-format ignore"
    regex: 'swift-format-ignore-file'
    message: >
      Do not ignore swift-format for a whole file. Fix the layout.
    severity: error

# Default layout rules that fight swift-format, plus the enum-raw-value
# pair kept as explicit_enum_raw_value.
disabled_rules:
  - opening_brace
  - closure_parameter_position
  - trailing_comma
  - redundant_string_enum_value

